<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dawn on WebGL 2</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 13px monospace; }
  canvas { display: block; width: 640px; height: 360px; }
  pre { margin: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="canvas" width="640" height="360"></canvas>
<pre id="log"></pre>
<script>
  const log = document.getElementById('log');
  const append = (text) => { log.textContent += text + '\n'; };
  var Module = {
    canvas: document.getElementById('canvas'),
    print: (text) => { append(text); console.log(text); },
    printErr: (text) => { append('[err] ' + text); console.error(text); },
  };
  window.addEventListener('error', (e) => append('[exception] ' + e.message));
</script>
{{{ SCRIPT }}}
</body>
</html>
